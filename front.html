<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JC Hotel · 프론트데스크</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0F1E35; color: #e2e8f0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; min-height: 100vh; }
  header { background: #0A1628; border-bottom: 1px solid #1C2E45; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .logo { font-size: 18px; font-weight: 700; color: #C8A45A; }
  .live { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #4ADE80; }
  .live::before { content:''; width:8px; height:8px; background:#4ADE80; border-radius:50%; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .main { padding: 28px 32px; max-width: 960px; }
  .dash-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  h2 { font-size: 20px; font-weight: 700; }
  .count { color: #C8A45A; margin-left: 8px; }
  .orders { display: flex; flex-direction: column; gap: 14px; }
  .order-card { background: #0A1628; border: 1px solid #1C2E45; border-radius: 14px; padding: 20px 24px; transition: border-color 0.3s; }
  .order-card.new { border-color: #C8A45A; }
  .order-card.heating { border-color: #EF4444; }
  .order-card.delivering { border-color: #3B82F6; }
  .order-card.done { opacity: 0.4; border-color: #1C2E45; }
  .order-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .room-tag { background: #C8A45A; color: #000; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 6px; }
  .guest-name { font-size: 16px; font-weight: 700; margin-left: 10px; }
  .pay-badge { font-size: 11px; padding: 3px 10px; border-radius: 4px; font-weight: 700; }
  .pay-room { background: rgba(200,164,90,0.15); color: #C8A45A; border: 1px solid rgba(200,164,90,0.3); }
  .pay-pre { background: rgba(59,130,246,0.15); color: #60A5FA; border: 1px solid rgba(59,130,246,0.3); }
  .status-badge { font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 700; }
  .s-new { background: rgba(200,164,90,0.15); color: #C8A45A; }
  .s-heating { background: rgba(239,68,68,0.15); color: #F87171; }
  .s-delivering { background: rgba(59,130,246,0.15); color: #60A5FA; }
  .order-items { margin-bottom: 12px; border-bottom: 1px solid #1C2E45; padding-bottom: 12px; }
  .order-item { display: flex; gap: 8px; padding: 4px 0; font-size: 14px; }
  .item-name { flex: 1; }
  .item-qty { color: #C8A45A; font-weight: 700; }
  .memo-box { background: #0F1E35; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #4A6A82; margin-bottom: 14px; }
  .memo-box span { color: #e2e8f0; }
  .order-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .order-time { font-size: 12px; color: #4A6A82; }
  .order-total { font-size: 16px; font-weight: 700; color: #C8A45A; }
  .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .action-btn { border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-heat { background: rgba(239,68,68,0.15); color: #F87171; border: 1px solid rgba(239,68,68,0.3); }
  .btn-deliver { background: rgba(59,130,246,0.15); color: #60A5FA; border: 1px solid rgba(59,130,246,0.3); }
  .btn-done { background: #1C2E45; color: #4A6A82; border: 1px solid #1C2E45; }
  .empty { text-align: center; padding: 80px; color: #4A6A82; font-size: 15px; }
  .order-card.confirmed { opacity: 0.5; border-color: #1C2E45; }
  .order-card.cancelled { opacity: 0.4; border-color: #1C2E45; }
  .s-pending { background: rgba(200,164,90,0.15); color: #C8A45A; }
  .s-confirmed { background: rgba(74,222,128,0.15); color: #4ADE80; }
  .s-cancelled { background: rgba(239,68,68,0.15); color: #F87171; }
  .btn-confirm { background: rgba(74,222,128,0.15); color: #4ADE80; border: 1px solid rgba(74,222,128,0.3); }
  .btn-cancel { background: rgba(239,68,68,0.15); color: #F87171; border: 1px solid rgba(239,68,68,0.3); }
  .s-checkin-due { background: rgba(96,165,250,0.15); color: #60A5FA; }
  .s-checkout-due { background: rgba(245,158,11,0.15); color: #F59E0B; }
  .btn-checkin { background: rgba(96,165,250,0.15); color: #60A5FA; border: 1px solid rgba(96,165,250,0.3); }
  .btn-checkout { background: rgba(245,158,11,0.15); color: #F59E0B; border: 1px solid rgba(245,158,11,0.3); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0A1628; border: 1px solid #C8A45A; color: #e2e8f0; padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }

  /* 모바일 */
  @media (max-width: 640px) {
    header { padding: 12px 16px; }
    .logo { font-size: 15px; }
    .live { font-size: 11px; }
    header #clock { display: none; }
    .main { padding: 16px; max-width: 100%; }
    h2 { font-size: 17px; }
    .order-card { padding: 14px 16px; }
    .guest-name { font-size: 14px; margin-left: 6px; }
    .order-actions { width: 100%; }
    .action-btn { flex: 1; min-width: 0; padding: 10px 8px; }
    .toast { width: calc(100% - 32px); white-space: normal; text-align: center; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">JC Hotel · 프론트데스크</div>
  <div style="display:flex;align-items:center;gap:20px;">
    <div class="live">실시간 연결 중</div>
    <div style="font-size:14px;color:#4A6A82;" id="clock"></div>
  </div>
</header>

<div class="main">
  <div class="dash-header">
    <h2>🔔 주문 대기열 <span class="count" id="order-count">(0)</span></h2>
  </div>
  <div class="orders" id="orders">
    <div class="empty">들어온 주문이 없습니다</div>
  </div>

  <div class="dash-header" style="margin-top:36px;">
    <h2>🚪 오늘 체크인 · 체크아웃 <span class="count" id="res-count">(0)</span></h2>
  </div>
  <div class="orders" id="reservations">
    <div class="empty">오늘 예정된 체크인/체크아웃이 없습니다</div>
  </div>

  <div class="dash-header" style="margin-top:36px;">
    <h2>🔑 키 미회수 <span class="count" id="key-pending-count">(0)</span></h2>
  </div>
  <div class="orders" id="key-pending">
    <div class="empty">미회수 키가 없습니다</div>
  </div>

  <div class="dash-header" style="margin-top:36px;">
    <h2>🥐 조식 신청 <span class="count" id="breakfast-count">(0)</span></h2>
    <div style="font-size:13px;color:#4A6A82" id="breakfast-date"></div>
  </div>
  <div class="orders" id="breakfasts">
    <div class="empty">오늘 조식 신청이 없습니다</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, setDoc, query, orderBy, where, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSFNwHWreQ5py9lq8fINEMAmGj_wbEqjE",
    authDomain: "jc-hotel-roombar-27c58.firebaseapp.com",
    projectId: "jc-hotel-roombar-27c58",
    storageBucket: "jc-hotel-roombar-27c58.firebasestorage.app",
    messagingSenderId: "866392617860",
    appId: "1:866392617860:web:33d262c60779179f55e3d1"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('ko-KR');
  }, 1000);

  const q = query(collection(db,'orders'), orderBy('createdAt','desc'));
  onSnapshot(q, (snap) => {
    const orders = snap.docs.map(d => ({id:d.id,...d.data()})).filter(o => o.status !== 'done');
    document.getElementById('order-count').textContent = `(${orders.length})`;
    const el = document.getElementById('orders');
    if (!orders.length) { el.innerHTML = '<div class="empty">들어온 주문이 없습니다</div>'; return; }
    el.innerHTML = orders.map(o => {
      const time = o.createdAt?.toDate?.() ? timeAgo(o.createdAt.toDate()) : '방금 전';
      const payBadge = o.payment === 'prepaid'
        ? '<span class="pay-badge pay-pre">삼성페이 선결제</span>'
        : '<span class="pay-badge pay-room">객실 후불청구</span>';
      const statusMap = { new:'<span class="status-badge s-new">🟡 신규</span>', heating:'<span class="status-badge s-heating">🔴 히팅 중</span>', delivering:'<span class="status-badge s-delivering">🔵 배달 중</span>' };
      const itemsHTML = (o.items||[]).map(i => `<div class="order-item"><span class="item-name">• ${i.name}</span><span class="item-qty">${i.qty}개</span></div>`).join('');
      return `<div class="order-card ${o.status||'new'}">
        <div style="position:absolute;display:none;" id="x"></div>
        <div class="order-top">
          <div style="display:flex;align-items:center;">
            <span class="room-tag">Room ${o.room}</span>
            <span class="guest-name">${o.guestName||''} 고객님</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            ${statusMap[o.status||'new']||''}
            ${payBadge}
          </div>
        </div>
        <div class="order-items">${itemsHTML}</div>
        ${o.memo ? `<div class="memo-box">메모: <span>${o.memo}</span></div>` : ''}
        <div class="order-footer">
          <div>
            <div class="order-time">접수: ${time}</div>
            <div class="order-total">₩${(o.total||0).toLocaleString()}</div>
          </div>
          <div class="order-actions">
            ${o.status==='new' ? `<button class="action-btn btn-heat" onclick="setStatus('${o.id}','heating')">🔥 히팅 시작</button>` : ''}
            ${o.status!=='delivering' ? `<button class="action-btn btn-deliver" onclick="setStatus('${o.id}','delivering')">🛵 배달 시작</button>` : ''}
            <button class="action-btn btn-done" onclick="setStatus('${o.id}','done')">✅ 완료</button>
          </div>
        </div>
      </div>`;
    }).join('');
  });

  window.setStatus = async (id, status) => {
    await updateDoc(doc(db,'orders',id), { status });
    const msgs = { heating:'🔥 히팅 시작!', delivering:'🛵 배달 시작!', done:'✅ 완료 처리' };
    toast(msgs[status]);
  };

  // ── 오늘 체크인 · 체크아웃 ─────────────────────────────
  let _allReservations = [];
  const rq = query(collection(db,'hotel_reservations'), orderBy('createdAt','desc'));
  onSnapshot(rq, (snap) => {
    _allReservations = snap.docs.map(d => ({id:d.id,...d.data()}));
    const today = new Date().toLocaleDateString('sv-SE');
    const arrivals = _allReservations.filter(r => r.status === 'booked' && r.checkin === today);
    const departures = _allReservations.filter(r => r.status === 'checkedin' && r.checkout === today);
    const list = [...arrivals.map(r=>({...r,_kind:'in'})), ...departures.map(r=>({...r,_kind:'out'}))];
    document.getElementById('res-count').textContent = `(${list.length})`;
    const el = document.getElementById('reservations');
    if (!list.length) { el.innerHTML = '<div class="empty">오늘 예정된 체크인/체크아웃이 없습니다</div>'; return; }
    el.innerHTML = list.map(r => {
      const isIn = r._kind === 'in';
      return `<div class="order-card new">
        <div class="order-top">
          <div style="display:flex;align-items:center;">
            <span class="room-tag">Room ${r.roomId}</span>
            <span class="guest-name">${r.name||''} 고객님</span>
          </div>
          <span class="status-badge ${isIn?'s-checkin-due':'s-checkout-due'}">${isIn?'🔵 체크인 예정':'🟠 체크아웃 예정'}</span>
        </div>
        <div class="order-footer">
          <div class="order-time">${r.checkin||''} ~ ${r.checkout||''} · ${r.guests||1}명</div>
          <div class="order-actions">
            ${isIn
              ? `<button class="action-btn btn-checkin" onclick="doCheckin('${r.id}','${r.roomId}')">✅ 체크인</button>`
              : `<button class="action-btn btn-checkout" onclick="doCheckout('${r.id}','${r.roomId}')">🚪 체크아웃 (키 회수함)</button>`}
          </div>
        </div>
      </div>`;
    }).join('');
    renderKeyPending();
  });

  window.doCheckin = async (id, roomId) => {
    await updateDoc(doc(db,'hotel_reservations',id), { status:'checkedin', checkinAt:serverTimestamp() });
    if (roomId) await setDoc(doc(db,'rooms',roomId), { active:true, updatedAt:serverTimestamp() }, { merge:true });
    toast('✅ 체크인 완료 — 객실 룸서비스 활성화됨');
  };

  window.doCheckout = async (id, roomId) => {
    await updateDoc(doc(db,'hotel_reservations',id), { status:'checkedout', checkoutAt:serverTimestamp(), keyReturned:true, autoCheckout:false });
    if (roomId) await setDoc(doc(db,'rooms',roomId), { active:false, totalAmount:0, lastCheckout:serverTimestamp(), updatedAt:serverTimestamp() }, { merge:true });
    toast('🚪 체크아웃 완료 — 객실 룸서비스 비활성화 + 정산됨');
  };

  // ── 키 미회수 확인 ────────────────────────────────────
  function renderKeyPending() {
    const el = document.getElementById('key-pending');
    if (!el) return;
    const list = _allReservations.filter(r => r.status==='checkedout' && r.keyReturned===false);
    document.getElementById('key-pending-count').textContent = `(${list.length})`;
    if (!list.length) { el.innerHTML = '<div class="empty">미회수 키가 없습니다</div>'; return; }
    el.innerHTML = list.map(r => `<div class="order-card new">
      <div class="order-top">
        <div style="display:flex;align-items:center;">
          <span class="room-tag">Room ${r.roomId}</span>
          <span class="guest-name">${r.name||''} 고객님</span>
        </div>
        <span class="status-badge s-checkout-due">🔑 키 미회수${r.autoCheckout?' (자동 체크아웃)':''}</span>
      </div>
      <div class="order-footer">
        <div class="order-time">체크아웃: ${r.checkout||''}</div>
        <div class="order-actions">
          <button class="action-btn btn-confirm" onclick="markKeyReturned('${r.id}')">🔑 회수 확인</button>
        </div>
      </div>
    </div>`).join('');
  }

  window.markKeyReturned = async (id) => {
    await updateDoc(doc(db,'hotel_reservations',id), { keyReturned:true });
    toast('🔑 키 회수 확인 완료');
  };

  // ── 자동 체크아웃 (이 화면이 켜져 있는 동안 동작) ─────
  async function autoCheckoutTick() {
    try {
      const snap = await getDoc(doc(db,'settings','global'));
      const checkoutTime = snap.exists() ? (snap.data().checkoutTime || '11:00') : '11:00';
      const [ch, cm] = checkoutTime.split(':').map(Number);
      const now = new Date();
      const cutoff = new Date(now); cutoff.setHours(ch, cm, 0, 0);
      if (now < cutoff) return;
      const today = new Date().toLocaleDateString('sv-SE');
      const due = _allReservations.filter(r => r.status==='checkedin' && r.checkout===today);
      for (const r of due) {
        await updateDoc(doc(db,'hotel_reservations',r.id), { status:'checkedout', checkoutAt:serverTimestamp(), keyReturned:false, autoCheckout:true });
        if (r.roomId) await setDoc(doc(db,'rooms',r.roomId), { active:false, totalAmount:0, lastCheckout:serverTimestamp(), updatedAt:serverTimestamp() }, { merge:true });
      }
    } catch(e) { console.error('자동 체크아웃 오류:', e); }
  }
  setTimeout(autoCheckoutTick, 3000);
  setInterval(autoCheckoutTick, 60000);

  // ── 조식 신청 ────────────────────────────────────────
  // 조식 마감(오전 10시) 이후에는 자동으로 "내일 신청" 목록으로 넘어감
  const BREAKFAST_CUTOFF_HOUR = 10;
  function breakfastDayStr() {
    const now = new Date();
    const d = new Date(now);
    if (now.getHours() >= BREAKFAST_CUTOFF_HOUR) d.setDate(d.getDate()+1);
    return d.toLocaleDateString('sv-SE');
  }

  let breakfastUnsub = null, breakfastDate = null;
  function subscribeBreakfast() {
    const today = breakfastDayStr();
    if (breakfastDate === today) return;
    breakfastDate = today;
    document.getElementById('breakfast-date').textContent = today + ' 조식';
    if (breakfastUnsub) breakfastUnsub();
    const bq = query(collection(db,'hotel_breakfast'), where('date','==',today));
    breakfastUnsub = onSnapshot(bq, (snap) => {
      const list = snap.docs.map(d => ({id:d.id,...d.data()})).sort((a,b)=>(b.ts?.seconds||0)-(a.ts?.seconds||0));
      const active = list.filter(r => r.status !== 'cancelled');
      document.getElementById('breakfast-count').textContent = `(${active.length})`;
      const el = document.getElementById('breakfasts');
      if (!list.length) { el.innerHTML = '<div class="empty">오늘 조식 신청이 없습니다</div>'; return; }
      el.innerHTML = list.map(r => {
        const time = r.ts?.toDate?.() ? r.ts.toDate().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '';
        const cancelled = r.status === 'cancelled';
        const confirmed = r.status === 'confirmed';
        const cardClass = cancelled ? 'cancelled' : confirmed ? 'confirmed' : 'new';
        const badgeClass = cancelled ? 's-cancelled' : confirmed ? 's-confirmed' : 's-pending';
        const badgeText = cancelled ? '❌ 취소됨' : confirmed ? '✅ 확인됨' : '🟡 대기';
        return `<div class="order-card ${cardClass}">
          <div class="order-top">
            <div style="display:flex;align-items:center;">
              <span class="room-tag">Room ${r.roomId}</span>
              <span class="guest-name">${r.guestCount||1}명 · ${r.mealType==='western'?'🍳 양식':'🍚 한식'}</span>
            </div>
            <span class="status-badge ${badgeClass}">${badgeText}</span>
          </div>
          ${r.note ? `<div class="memo-box">요청사항: <span>${r.note}</span></div>` : ''}
          <div class="order-footer">
            <div class="order-time">신청: ${time}</div>
            <div class="order-actions">
              ${r.status==='pending' ? `<button class="action-btn btn-confirm" onclick="confirmBreakfast('${r.id}')">✅ 확인</button>` : ''}
              ${!cancelled ? `<button class="action-btn btn-cancel" onclick="cancelBreakfast('${r.id}')">✖ 취소</button>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    });
  }
  subscribeBreakfast();
  // 자정이 지나면 자동으로 오늘 날짜 목록으로 갱신
  setInterval(subscribeBreakfast, 60000);

  window.confirmBreakfast = async (id) => {
    await updateDoc(doc(db,'hotel_breakfast',id), { status:'confirmed' });
    toast('✅ 조식 신청 확인');
  };

  window.cancelBreakfast = async (id) => {
    await updateDoc(doc(db,'hotel_breakfast',id), { status:'cancelled' });
    toast('❌ 조식 신청 취소');
  };

  function timeAgo(date) {
    const diff = Math.floor((Date.now()-date)/1000);
    if (diff < 60) return '방금 전';
    if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
    return `${Math.floor(diff/3600)}시간 전`;
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
